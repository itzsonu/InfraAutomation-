
AWSTemplateFormatVersion: '2010-09-09'
Description: Classroom IaC lab - Lambda function and execution role

Resources:
  StudentLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  StudentIaCFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt StudentLambdaRole.Arn
      Timeout: 10
      MemorySize: 128
      Code:
        ZipFile: |
          import json
          def lambda_handler(event, context):
              name = event.get("name", "Student")
              print("IaC function invoked")
              return {
                  "statusCode": 200,
                  "body": json.dumps({
                      "message": f"Hello, {name}! Updated usign CloudFormation."
                  })
              }

Outputs:
  FunctionName:
    Description: Lambda function created by CloudFormation
    Value: !Ref StudentIaCFunction
